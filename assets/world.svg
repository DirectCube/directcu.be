<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" shape-rendering="crispEdges">
  <style>
    .drift { animation: drift 240s steps(240) infinite; }
    .birds { animation: drift 120s steps(240) infinite; }
