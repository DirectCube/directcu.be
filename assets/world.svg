    .shim-a, .shim-b { animation: shim 3s steps(1) infinite; }
    .shim-b { animation-delay: -1.5s; }
    @keyframes shim { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .drift, .birds, .shim-a, .shim-b { animation: none; }
    }
